"changelog"
{
	"31/07/2026"
	{
		"date_long"	"July 31st 2026"
		"change1" "Added a new type of lottery, Equal Lotteries, which require all tickets to have a value of 100"
		"change2"  "Added !mailrtd !mailrape !mailhug"
	}
	"29/07/2026"
	{
		"date_long"	"July 29th 2026"
		"change1"	"Added !mail, use '!mail obama hey obama' to send mail to your friends, even if they're offline"
		"change2"	"Added playtime alerts for reaching 10 hours of playtime, which awards you a Stimulus Check (100 gems) to your mailbox"
		"change3"	"Use !gift to mail a friend gems, such as '!gift dolltoucher 100'"
		"change4"	"The Vaccinator and Quick-Fix no longer award gems for Ubers/Drops"
		"change5"	"Ubers during setup time no longer count for gems"
	}
	"28/07/2026"
	{
		"date_long"	"July 28th 2026"
		"change1"	"Upgraded the WhaleTracker API in preparation for the new mailbox pluginw"
	}
	"27/07/2026"
	{
		"date_long"	"July 27th 2026"
		"change1"	"Added gems for juggling, hit an airborne enemy twice with a projectile within 1.5 seconds to receive 2 gems"
	}
	"26/07/2026"
	{
		"date_long"	"July 26th 2026"
		"change1"	"Improved '!lotto all' by making it refund your ticket automatically, added !allin as an alias for !lotto all"
		"change2"	"Added !firework, which allows you to use the rtd firework effect on yourself for 25 gems, or on others for 50 gems"
		"change3"	"Added rape duel history with !duelhistory"
		"change4"	"Added a new sound effect, xp_levelup, for 500 gem milestones, winning the lottery and more"
		"change5"	"Added gem bonuses for completing the per-map gem limits, which will play the new sound"
		"change6"	"Made !bspray available to non-admins, made using other player's sprays in !spray commands available for non-admins"
		"change7"	"Added a votemenu listener system, type 'freertd' or !freertd to instantly start a free rtd vote"
		"change8"	"You can now use !flip or !toss to receive a Heads/Tails result"
		"change9"	"Added !swap, target a client on the other team and pay 25 gems to swap teams with them"
		"change10"	"Added Sandman moonshot gem rewards (3 gems, limit of 1)"
		"change11"	"Made Pyro reflect airshots valid, added a gem reward for midair backstabs"
		"change12"	"Added !rapeprotect, !protect, !shield which protects your friend from one rape"
		"change13"	"Improved !lottos / !lottohistory so that it shows profit"
		"change14"  "Added !ebt"
		"change15"	"Added chat alerts and a gem reward for killing a Medic with >=90% uber"
		"change16"  "Killing a client with fall damage or by knocking them off the map now provides one gem (experimental)"
		"change17"  "Added a free rtd alert for new joiners when rtd is currently free"
		"change18"  "Expanded the !airshots command and added !meatshots !ms !ubers !drops as aliases"
		"change19"  "Made scrambles occcur if the first Payload point is captured in under 1 minute"
		"change20"  "Made scrambles occur if an Attack/Defend round ends in under 3 minutes"
		"change21"  "Made scrambles occur if a 5CP round ends in under 3 minutes"
		"change22"  "Added !log or !changelog"
		"change23"  "Vote bonus bros can now control their rtv value by using !rtv 1/2/3 instead of !rtv"
	}
	"25/07/2026"
	{
		"date_long"	"July 25th 2026"
		"change1"	"Added a queue system, use 'connect kogasa.tf' when the server is full to join anyway! You'll be in spectator until a team falls below 12 players."
