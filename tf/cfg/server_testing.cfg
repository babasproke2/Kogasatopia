exec server.cfg
// The server name that players will see in the server browser and in the scoreboard
hostname "MGE Eientei | New Jersey"
mapcyclefile "mapcycle_testing.txt"
sm_emptymaps_file "empty_training_maps.cfg"
sv_tags "uncle,eientei,mge,kogasa,bant"
sm_ignore_base_map 1
tf_weapon_criticals_0
tf_weapon_criticals_melee 0
sm_mapstats_on 0
disable_respawn_times 0
// Misc
sv_downloadurl "http://fastdl.kogasa.tf/tf2"

// WhaleTracker Rust SQL outlet (testing server)
sm_whaletracker_online_update_interval "30.0"
sm_whaletracker_rust_port "28018"
