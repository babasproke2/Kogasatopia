// ConVars for plugin "new_engi_buildings.smx"


// Amplifier

// Distance the amplifier works.
// -
// Default: "240.0"
amplifier_distance "300.0"

// Length in seconds for the Amplifier condition to last
// -
// Default: "3.0"
amplifier_effect_length "5.0"

// Enable Amplifier death explosions? >0 for damage value.
// -
// Default: "65"
// Minimum: "0.000000"
// Maximum: "1.000000"
amplifier_explode "50"

// Force amplifier mode: 0=nothing, 1=dispenser, 2=sentry, 3=both
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "3.000000"
amplifier_force "0"

// If >0 and human player count is below this value, treat amplifier_force as 2 (sentry only).
// -
// Default: "0"
// Minimum: "0.000000"
amplifier_force_playercount "10"

// Maximum amount of metal an amplifier can hold.
// -
// Default: "200.0"
amplifier_max "200.0"

// Amount of metal to use to apply a condition to a player (per second).
// -
// Default: "5.0"
amplifier_metal "5.0"

// Should Amplifier pulses harm the enemy team? 0 to disable, >0 for damage.
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "50.000000"
amplifier_zap "25.0"


// Engineer Pads

// Interval between chat announcements about the plugin. 0.0 to disable.
// -
// Default: "347.0"
// Minimum: "0.000000"
pads_announce "347.0"

// Toggle blocking Eureka Effect from teleporting to Pads that are Exits.
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
pads_block_eureka "1"

// Should boosted players lose their boost when airblasted?
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
pads_boost_airblast "1"

// Set to 1 to prevent scoped-in/revved up players from being speed boosted.
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
pads_boost_block_aiming "1"

// How long in seconds should Boost Pads take to recharge?
// -
// Default: "3.0"
// Minimum: "0.100000"
pads_boost_cooldown "3.0"

// How much damage can a boosted player take before losing their boost? 0 to disable.
// -
// Default: "35"
// Minimum: "0.000000"
pads_boost_damage_threshold "35"

// How long, in seconds, should Boost Pads boost players for?
// -
// Default: "5.0"
// Minimum: "0.000000"
pads_boost_duration "5.0"

// What minimum speed should players be boosted to when using Boost Pads?
// -
// Default: "520.0"
// Minimum: "0.000000"
pads_boost_speed "520.0"

// If enabled, Bots will build Boost Pads instead of Teleporters.
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
pads_bots_can_build "0"

// Enables/Disables the plugin. (2 - BoostPads only, 3 - JumpPads only)
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "3.000000"
pads_enabled "1"

// How much HP Pads will have.
// -
// Default: "100"
// Minimum: "1.000000"
pads_health "100"

// If enabled, prevents Snipers from scoping in while using Jump Pads.
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
pads_jump_block_snipers "1"

// How long, in seconds, should Jump Pads take to recharge?
// -
// Default: "3.0"
// Minimum: "0.100000"
pads_jump_cooldown "3.0"

// Multiply crouching players' height by this much when using Jump Pads.
// -
// Default: "1.0"
// Minimum: "0.000000"
pads_jump_crouch_height_mult "1.0"

// Multiply crouching players' speed by this much when using Jump Pads.
// -
// Default: "1.0"
// Minimum: "0.000000"
pads_jump_crouch_speed_mult "1.0"

// How fast players will be launched vertically by Jump Pads.
// -
// Default: "700.0"
// Minimum: "0.000000"
pads_jump_height "700.0"

// How fast players will be launched horizontally by Jump Pads.
// -
// Default: "700.0"
// Minimum: "0.000000"
pads_jump_speed "700.0"

// Pad size multiplier.
// -
// Default: "0.7"
// Minimum: "0.000000"
// Maximum: "5.000000"
pads_size "0.7"

// 0 - Nothing 1- Force Pads 2 - Force no pads
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
sm_engipads_force "0"
